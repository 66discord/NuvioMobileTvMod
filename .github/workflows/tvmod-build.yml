name: Nuvio TV Mod Build

on:
  workflow_dispatch:
  push:
    branches:
      - tvmod-mobile

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Nuvio TV Mod integration
        run: |
          chmod +x scripts/apply-tvmod-mobile.sh
          ./scripts/apply-tvmod-mobile.sh

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobileTvMod-debug
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
